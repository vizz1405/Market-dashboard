name: Refresh data and publish

on:
  schedule:
    - cron: "35 23 * * 1-5"   # 7:35 AM Singapore time, Tuesday to Saturday (after the US close)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.2" numpy
      - name: Download latest closes (Yahoo Finance)
        if: github.event_name != 'push'
        run: python3 pipeline/fetch_prices.py data/prices
      - name: Run the rules and build the dashboard data
        run: python3 pipeline/make_site_data.py data/prices site/data
      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
